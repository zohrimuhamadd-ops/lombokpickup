name: unpack
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip -d .
            rm -f *.zip
            touch .nojekyll
            echo www.lombokpickup.com > CNAME
            git config user.name github-actions
            git config user.email actions@github.com
            git add -A
            git commit -m "Unpack site"
            git push
          fi
